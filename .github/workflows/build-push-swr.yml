name: Build and Push to SWR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: mediaagent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.SWR_REGISTRY }}/${{ vars.SWR_ORG }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.SWR_REGISTRY }}/${{ vars.SWR_ORG }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate deploy summary
        run: |
          echo "## 🚀 部署命令" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "构建成功！在 ECS 上执行以下命令部署：" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cd ~/mediaagent && git pull && MEDIA_AGENT_TAG=${GITHUB_SHA::12} bash scripts/deploy-pull.sh" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
